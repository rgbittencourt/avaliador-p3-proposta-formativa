services:
  - type: web
    name: avaliador-p3
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_USERNAME
        value: professor
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IA_PROVEDOR
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_OWNER
        value: rgbittencourt
      - key: GITHUB_DATA_REPO
        value: avaliador-p3-proposta-formativa-dados
      - key: GITHUB_DATA_BRANCH
        value: main
